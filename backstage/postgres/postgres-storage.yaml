# kubernetes/postgres-storage.yaml
# Dynamically provisioned by Longhorn (replaces the old manual hostPath PV)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-storage-claim
  namespace: backstage
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
